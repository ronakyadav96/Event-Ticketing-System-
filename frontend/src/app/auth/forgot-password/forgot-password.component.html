<div class="login-box">
  <div class="auth-brand"><app-brand-logo></app-brand-logo></div>
  <h2>Reset password</h2>
  <p class="auth-sub">We will email you a one-time code</p>

  <ng-container *ngIf="step === 'email'">
    <input type="email" placeholder="Email" [(ngModel)]="email" (keyup.enter)="requestOtp()" />

    <button (click)="requestOtp()" [disabled]="loading">
      <span *ngIf="!loading">Send OTP</span>
      <span class="btn-loader" *ngIf="loading"></span>
    </button>
  </ng-container>

  <ng-container *ngIf="step === 'reset'">
    <p class="info" *ngIf="info">{{ info }}</p>
    <input type="text" inputmode="numeric" placeholder="OTP" [(ngModel)]="otp" />
    <input type="password" placeholder="New password" [(ngModel)]="password" />
    <input type="password" placeholder="Confirm new password" [(ngModel)]="confirmPassword" (keyup.enter)="resetPassword()" />

    <button (click)="resetPassword()" [disabled]="loading">
      <span *ngIf="!loading">Update password</span>
      <span class="btn-loader" *ngIf="loading"></span>
    </button>
  </ng-container>

  <p class="error" *ngIf="error">{{ error }}</p>

  <p class="register-text">
    Remembered it? <a routerLink="/login">Back to login</a>
  </p>
</div>
