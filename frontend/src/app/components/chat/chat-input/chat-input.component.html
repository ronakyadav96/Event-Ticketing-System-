<form class="composer" (submit)="$event.preventDefault(); onSubmit()">
  <textarea
    #box
    class="field"
    [(ngModel)]="inputText"
    name="message"
    (keydown)="onKeyDown($event)"
    (input)="autoGrow(box)"
    rows="1"
    maxlength="2000"
    [placeholder]="listening() ? 'Listening…' : 'Ask in English or Hinglish — e.g. kal ke concerts'"
    aria-label="Message Event AI"></textarea>

  <button
    *ngIf="canListen"
    type="button"
    class="mic"
    [class.on]="listening()"
    (click)="toggleVoice()"
    [attr.aria-label]="listening() ? 'Stop listening' : 'Speak your request'"
    [title]="listening() ? 'Listening… tap to stop' : 'Speak (English or Hinglish)'">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/>
    </svg>
  </button>

  <button type="submit" class="send" [disabled]="!inputText.trim() || chat.isSending()" aria-label="Send">
    <svg *ngIf="!chat.isSending()" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M5 12h14M13 6l6 6-6 6"/>
    </svg>
    <span *ngIf="chat.isSending()" class="spinner"></span>
  </button>
</form>
