<header class="header">
  <div class="identity">
    <span class="avatar" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 3l1.9 4.6L18.5 9.5l-4.6 1.9L12 16l-1.9-4.6L5.5 9.5l4.6-1.9z"/>
        <path d="M19 15l.8 2.2L22 18l-2.2.8L19 21l-.8-2.2L16 18l2.2-.8z"/>
      </svg>
    </span>
    <div class="titles">
      <h2>Event AI</h2>
      <p><span class="dot" aria-hidden="true"></span>Finds shows for you · English &amp; Hinglish</p>
    </div>
  </div>

  <div class="actions">
    <button type="button" class="icon-btn" [class.active]="chat.showHistory()" (click)="chat.toggleHistory()" title="Your chats" aria-label="Your chats">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/><path d="M12 7v5l3 2"/>
      </svg>
    </button>
    <button type="button" class="icon-btn" (click)="chat.startNewChat()" title="New chat" aria-label="New chat">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/>
      </svg>
    </button>
    <button type="button" class="icon-btn hide-mobile" (click)="chat.toggleExpand()" [title]="chat.isExpanded() ? 'Shrink' : 'Expand'" [attr.aria-label]="chat.isExpanded() ? 'Shrink' : 'Expand'">
      <svg *ngIf="!chat.isExpanded()" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7"/>
      </svg>
      <svg *ngIf="chat.isExpanded()" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 14h6v6M20 10h-6V4M14 10l7-7M3 21l7-7"/>
      </svg>
    </button>
    <button type="button" class="icon-btn" (click)="chat.close()" title="Close" aria-label="Close">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M18 6L6 18M6 6l12 12"/>
      </svg>
    </button>
  </div>
</header>
