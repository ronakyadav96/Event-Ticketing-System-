<div class="msg-row" [class.user]="message.role === 'user'">
  <span *ngIf="message.role === 'assistant'" class="avatar" aria-hidden="true">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 3l1.9 4.6L18.5 9.5l-4.6 1.9L12 16l-1.9-4.6L5.5 9.5l4.6-1.9z"/>
    </svg>
  </span>
  <div class="bubble" [class.error]="message.isError">
    <div class="content" [innerHTML]="formattedContent"></div>
    <time class="time">{{ formatTimestamp(message.timestamp) }}</time>
  </div>
</div>
