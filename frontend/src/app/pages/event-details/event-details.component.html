    <div class="event-bg" [ngStyle]="bgStyle" [ngClass]="designTemplateClass">
      <div class="overlay"></div>

      <div class="content">
        <div class="details-wrap">
          <div *ngIf="loading" class="msg">Loading event...</div>

          <div *ngIf="!loading && error" class="load-error">
            <div class="load-error-icon">🎭</div>
            <h2>Couldn't load this show</h2>
            <p>{{ error }}</p>
            <div class="load-error-actions">
              <button type="button" class="retry-btn" (click)="ngOnInit()">Try again</button>
              <a routerLink="/events" class="home-link">Back to home</a>
            </div>
          </div>

          <div *ngIf="!loading && event">
            <!-- Category Templates from src/app/templates/ -->
            <ng-container [ngSwitch]="eventCategoryKey">
              <app-movie-template
                *ngSwitchCase="'movie'"
                [event]="event"
                [eventImageUrl]="eventImageUrl"
                [eventImgFailed]="eventImgFailed"
                [isFreeEvent]="isFreeEvent"
                [unitPriceRupees]="unitPriceRupees"
                [movieRecommendations]="movieRecommendations"
                (openBooking)="openBooking()"
              ></app-movie-template>

              <app-tamasha-template
                *ngSwitchDefault
                [event]="event"
                [eventImageUrl]="eventImageUrl"
                [eventImgFailed]="eventImgFailed"
                [isFreeEvent]="isFreeEvent"
                [unitPriceRupees]="unitPriceRupees"
                (openBooking)="openBooking()"
              ></app-tamasha-template>
            </ng-container>
          </div>
        </div>
      </div>
    </div>
